
name: Build Hugo Website

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hugo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.128.0
      HUGO_ENVIRONMENT: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Install Dart Sass
        run: sudo snap install dart-sass

      - name: Install Node.js dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          fi

      - name: Build Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo --gc --minify \
            --baseURL "https://kaistudio2.vercel.app/"

      - name: Check localhost links
        run: |
          if grep -R -n -E 'https?://localhost:1313' public --include="*.html"; then
            echo "ERROR: localhost links found"
            exit 1
          fi

      - name: Update public folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -f public/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "build: update public"
            git push
          fi
